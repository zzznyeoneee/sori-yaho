[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sori-yaho-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    # audio processing
    "demucs>=4.0",
    "madmom>=0.16",
    "librosa>=0.10",
    "soundfile>=0.12",
    # MIDI / notation
    "pretty_midi>=0.2.10",
    "music21>=9.1",
    "mido>=1.3",
    # guitar (phase 2)
    "basic-pitch>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
